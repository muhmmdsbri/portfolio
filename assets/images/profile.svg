<svg width="400" height="500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.4"/>
    </filter>
    <clipPath id="profileClip">
      <circle cx="200" cy="180" r="120"/>
    </clipPath>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="500" fill="#0F172A"/>
  
  <!-- Gradient overlay -->
  <rect width="400" height="500" fill="url(#bgGradient)" opacity="0.95"/>
  
  <!-- Decorative circles -->
  <circle cx="80" cy="80" r="70" fill="rgba(255,255,255,0.08)"/>
  <circle cx="350" cy="420" r="100" fill="rgba(255,255,255,0.06)"/>
  <circle cx="380" cy="60" r="60" fill="rgba(255,255,255,0.04)"/>
  
  <!-- Profile image placeholder with professional styling -->
  <g filter="url(#shadow)">
    <!-- Outer ring -->
    <circle cx="200" cy="180" r="125" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    
    <!-- Profile circle background -->
    <circle cx="200" cy="180" r="120" fill="rgba(255,255,255,0.95)"/>
    
    <!-- Professional photo representation -->
    <g clip-path="url(#profileClip)">
      <!-- Head area -->
      <ellipse cx="200" cy="140" rx="50" ry="55" fill="#D4A574"/>
      
      <!-- Suit/Jacket -->
      <path d="M 80 200 Q 80 240 120 280 L 280 280 Q 320 240 320 200 Z" fill="#1a2a4a"/>
      
      <!-- Shirt -->
      <path d="M 140 200 L 140 280 L 260 280 L 260 200 Z" fill="#FFFFFF"/>
      
      <!-- Tie -->
      <path d="M 195 200 L 190 240 L 200 245 L 210 240 L 205 200 Z" fill="#8B3A3A"/>
      
      <!-- Face details -->
      <circle cx="185" cy="130" r="6" fill="#2c2c2c"/>
      <circle cx="215" cy="130" r="6" fill="#2c2c2c"/>
      <path d="M 190 150 Q 200 155 210 150" stroke="#2c2c2c" stroke-width="2" fill="none"/>
      <path d="M 185 165 Q 200 170 215 165" stroke="#D4A574" stroke-width="1.5" fill="none"/>
    </g>
  </g>
  
  <!-- Name -->
  <text x="200" y="340" font-size="26" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial, sans-serif">Mohamed Sabry</text>
  
  <!-- Title -->
  <text x="200" y="370" font-size="13" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif">Professional Translator</text>
  <text x="200" y="388" font-size="13" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif">&amp; Digital Marketer</text>
  
  <!-- Accent line -->
  <line x1="60" y1="410" x2="340" y2="410" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  
  <!-- Badge -->
  <g>
    <circle cx="320" cy="80" r="35" fill="rgba(255,255,255,0.95)" filter="url(#shadow)"/>
    <text x="320" y="90" font-size="24" text-anchor="middle" fill="#0EA5E9" font-family="Arial, sans-serif">✓</text>
  </g>
</svg>
